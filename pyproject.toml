[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ultimate-bot"
version = "0.1.0"
description = "Hybrid local/cloud Discord AI bot"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "discord.py>=2.7,<3",
    "httpx>=0.27",
    "httpx2",  # the MCP SDK's HTTP client, used to pass headers to HTTP servers
    "mcp>=2,<3",
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = ["voice_worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
