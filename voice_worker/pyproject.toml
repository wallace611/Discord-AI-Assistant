[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ultimate-voice-worker"
version = "0.1.0"
description = "Voice channel worker for the Discord bot (Py-cord, DAVE)"
requires-python = ">=3.12"
# py-cord and discord.py both install the ``discord`` package, so this project
# must live in its own virtualenv (voice_worker/.venv), never next to the main bot.
# 2.8.1 is the version whose source was inspected for DAVE and receive support;
# its ``voice`` extra pulls PyNaCl and davey>=0.1.4,<1.
dependencies = [
    "py-cord[voice]>=2.8.1,<3",
    "davey>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["voice_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
